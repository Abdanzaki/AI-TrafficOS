# A generic, single database configuration for Alembic migrations.

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Sys.path prepending
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version location specification; This defaults
# to alembic/versions.
# version_locations = %(here)s/alembic/versions

# Version path separator; As of Alembic 1.8, this defaults to
# os.pathsep.
version_path_separator = os

# The output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Placeholder database connection URL (overridden dynamically in env.py from settings)
sqlalchemy.url = postgresql+asyncpg://trafficos:trafficos@localhost:5432/trafficos


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
