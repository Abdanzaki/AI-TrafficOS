services:
  postgres:
    image: postgres:16
    container_name: trafficos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trafficos
      POSTGRES_PASSWORD: trafficos
      POSTGRES_DB: trafficos
    ports:
      - "5432:5432"
    volumes:
      - trafficos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficos -d trafficos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: trafficos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trafficos-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trafficos-pgdata:
  trafficos-redisdata:
