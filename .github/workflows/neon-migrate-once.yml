name: Neon DB migrate (one-time)

permissions:
  checks: write
  contents: read
  actions: read

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install alembic "sqlalchemy[asyncio]" asyncpg pydantic pydantic-settings
      - name: Sanity check DB URL shape (no secret printed)
        run: |
          python3 - <<'EOF'
          import os
          url = os.environ["DATABASE_URL"]
          assert url.startswith("postgresql://"), "unexpected scheme"
          host = url.split("@")[1].split("/")[0]
          assert "-pooler" not in host, "pooled host not allowed for migrations"
          print("URL OK, host:", host)
          EOF
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      - name: Apply migrations
        run: alembic -c database/alembic.ini upgrade head 2>&1 | tee /tmp/migrate.log | sed -E 's#://[^:/@ ]+:[^/@ ]+@#://***:***@#g'
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      - name: Show current revision
        run: alembic -c database/alembic.ini current
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      - name: Publish redacted error to check output
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/migrate.log', 'utf8'); } catch (e) { log = '(log file missing)'; }
            log = log.replace(/:\/\/[^:/@\s]+:[^/@\s]+@/g, '://***:***@');
            if (log.length > 6000) log = log.slice(-6000);
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: context.sha,
            });
            const check = data.check_runs.find(c => c.name === 'migrate');
            if (!check) { core.setFailed('migrate check run not found'); return; }
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo, check_run_id: check.id,
              output: { title: 'Migration log (credentials redacted)', summary: '```\n' + log + '\n```' },
            });
