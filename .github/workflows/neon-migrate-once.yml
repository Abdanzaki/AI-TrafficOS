# One-time Neon DB migration job. Added 2026-10-09, removed after the run.
# Runs alembic migrations 0001-0006 against the Neon production database
# using the NEON_DIRECT_URL repo secret (direct, non-pooled URL).
name: Neon DB migrate (one-time)

permissions:
  checks: write
  contents: read
  actions: read

on:
  push:
    paths:
      - .github/workflows/neon-migrate-once.yml

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install alembic "sqlalchemy[asyncio]" asyncpg pydantic pydantic-settings
      - name: Sanity-check DB URL shape (host only, never the secret)
        run: |
          python - <<'EOF'
          import os
          from urllib.parse import urlparse
          host = urlparse(os.environ['DATABASE_URL']).hostname or ''
          print('DB host:', host)
          assert '-pooler' not in host, 'Pooled URL detected - migrations need the DIRECT Neon URL (pooling OFF)'
          EOF
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      - name: Apply migrations
        run: |
          set +e
          alembic -c database/alembic.ini upgrade head > /tmp/migrate.log 2>&1
          code=$?
          # redact any user:password in URLs before printing (never leak the secret)
          sed -E 's|://[^:/@ ]+:[^/@ ]+@|://***:***@|g' /tmp/migrate.log
          exit $code
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      - name: Show current revision
        run: alembic -c database/alembic.ini current
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      - name: Publish redacted error to check output
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/migrate.log', 'utf8'); } catch (e) { log = '(log file missing)'; }
            log = log.replace(/:\/\/[^:/@\s]+:[^/@\s]+@/g, '://***:***@');
            if (log.length > 6000) log = log.slice(-6000);
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: context.sha,
            });
            const check = data.check_runs.find(c => c.name === 'migrate');
            if (!check) { core.setFailed('migrate check run not found'); return; }
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo, check_run_id: check.id,
              output: { title: 'Migration log (credentials redacted)', summary: '```\n' + log + '\n```' },
            });
