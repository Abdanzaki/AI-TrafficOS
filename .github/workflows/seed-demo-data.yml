name: Seed Demo Data (one-off)

# One-off job: loads clearly-labeled demo traffic data into the database.
# Delete this workflow after a successful run.
on:
  workflow_dispatch:

jobs:
  seed:
    name: Seed demo dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal backend deps
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy[asyncio]" asyncpg pydantic pydantic-settings

      - name: Run seed script
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/seed_demo_data.py
